# Railway: set the service Root Directory to this folder (CarStatixBackend).
# Add a Postgres plugin so DATABASE_URL is available.

[build]
builder = "NIXPACKS"

[deploy]
# Open the HTTP port immediately. Do not run migrate in startCommand —
# that delays listen() and makes the healthcheck fail with no app logs.
startCommand = "node dist/index.js"
releaseCommand = "npx prisma migrate deploy"
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
