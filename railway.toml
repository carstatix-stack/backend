# Railway: set the service Root Directory to this folder (CarStatixBackend).
# Add a Postgres plugin and copy DATABASE_URL into this service.

[build]
builder = "NIXPACKS"

[deploy]
startCommand = "npm run start:prod"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
